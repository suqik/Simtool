[General]
cfgbase                     = "/home/suqikuai777/Program/SBI_Void/simulator/fastpm/Simtool/Pipeline/cfgs/Cosmology/"
cfgsubbase                  = "cosmo"

; >==== 1. Read cosmology parameters from file ====<
input                       = "cosmo_list.json"
; >================================================<

; >==== 2. Set specific cosmological parameters ====<
; n_fix_params              = 5
; fix_cosmo_names           = hubble, OmegaM, Omegab, ns, S8
; fix_cosmo_vals            = 0.6727, 0.3156, 0.0491, 0.9667, 0.852
