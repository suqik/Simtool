cfgsubbase                  = "cosmo"

; 1. Read cosmology parameters from file
; input                       = "cosmo_list.txt"

; 2. Set specific cosmological parameters
; n_fix_params              = 5
; fix_cosmo_names           = hubble, OmegaM, Omegab, ns, S8
